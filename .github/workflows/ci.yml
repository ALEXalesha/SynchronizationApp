# Проверки на каждый пуш.
#
# Раннер windows: программа только под Windows, и часть проверок держится за
# её правила - имена без учёта регистра, права через настоящий icacls
# (denied.test.js). Электрон тестам не нужен: main.js и renderer.js
# поднимаются с заглушками, поэтому его бинарник не скачивается вовсе.
# C#-версия (csharp/) проверяется тут же: те же законы, перенесённые в xUnit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Проверки
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Тесты, законы и законы масштаба
        run: npm test

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: C#-версия, тесты и законы
        run: dotnet test csharp/SyncGlass.sln
